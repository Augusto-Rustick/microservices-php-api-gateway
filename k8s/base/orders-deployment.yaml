apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: microservices
  labels:
    app: microservices
    service: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservices
      service: orders
  template:
    metadata:
      labels:
        app: microservices
        service: orders
    spec:
      containers:
      - name: orders
        image: docker.io/DOCKERHUB_USERNAME/orders:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: SERVICE_NAME
          value: "orders"
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_USER
          valueFrom:
            configMapKeyRef:
              name: microservices-config
              key: RABBITMQ_USER
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              name: microservices-secrets
              key: RABBITMQ_PASS
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /orders
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /orders
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: microservices
  labels:
    app: microservices
    service: orders
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: microservices
    service: orders
