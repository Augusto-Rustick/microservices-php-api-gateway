apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: microservices
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true
    services:
      - name: catalog-service
        url: http://catalog:80
        routes:
          - name: catalog-route
            paths:
              - /catalog*
            strip_path: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600

      - name: orders-service
        url: http://orders:80
        routes:
          - name: orders-route
            paths:
              - /orders*
            strip_path: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600
          - name: jwt
            config:
              claims_to_verify:
                - exp

      - name: promotions-service
        url: http://promotions:80
        routes:
          - name: promotions-route
            paths:
              - /promotions*
            strip_path: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600

      - name: payment-service
        url: http://payment:80
        routes:
          - name: payment-route
            paths:
              - /payment*
            strip_path: true
            methods:
              - GET
              - POST
              - PUT
              - DELETE
        plugins:
          - name: rate-limiting
            config:
              minute: 50
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              headers:
                - Accept
                - Authorization
                - Content-Type
              exposed_headers:
                - X-Auth-Token
              credentials: true
              max_age: 3600
          - name: jwt
            config:
              claims_to_verify:
                - exp

    consumers:
      - username: test-user
        jwt_secrets:
          - key: test-key
            secret: test-secret
            algorithm: HS256
      - username: admin-user
        jwt_secrets:
          - key: admin-key
            secret: admin-secret-key-2024
            algorithm: HS256

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: microservices
  labels:
    app: microservices
    service: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices
      service: kong
  template:
    metadata:
      labels:
        app: microservices
        service: kong
    spec:
      containers:
      - name: kong
        image: kong:3.7.1
        ports:
        - containerPort: 8000
          name: proxy-http
        - containerPort: 8443
          name: proxy-https
        - containerPort: 8001
          name: admin-http
        - containerPort: 8444
          name: admin-https
        env:
        - name: KONG_DATABASE
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: "/etc/kong/kong.yml"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
        - name: KONG_PLUGINS
          value: "bundled"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: kong-config
          mountPath: /etc/kong
      volumes:
      - name: kong-config
        configMap:
          name: kong-config

---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: microservices
  labels:
    app: microservices
    service: kong
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: proxy-http
  - port: 8443
    targetPort: 8443
    protocol: TCP
    name: proxy-https
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: admin-http
  - port: 8444
    targetPort: 8444
    protocol: TCP
    name: admin-https
  selector:
    app: microservices
    service: kong
