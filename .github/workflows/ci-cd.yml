name: CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ============================================================
  # JOB: BUILD - Construir e testar os microserviços
  # ============================================================
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, orders, promotions, payment]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, zip, amqp, pcov
          tools: composer

      - name: Install dependencies for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: composer test

      - name: Generate code coverage report for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-html=coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

      - name: Generate Swagger documentation for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: |
          vendor/bin/openapi src -o swagger.json || echo "Swagger generation skipped (optional)"

  # ============================================================
  # JOB: BUILD-DOCKER - Construir imagens Docker
  # ============================================================
  build-docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, orders, promotions, payment]
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:buildcache,mode=max

  # ============================================================
  # JOB: DEPLOY-STAGING - Deploy para ambiente de Staging
  # ============================================================
  deploy-staging:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Configure kubectl for staging
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes (Staging)
        run: |
          kubectl apply -k k8s/overlays/staging --namespace=staging || kubectl create namespace staging && kubectl apply -k k8s/overlays/staging --namespace=staging
          kubectl rollout status deployment -l app=microservices --namespace=staging --timeout=5m

  # ============================================================
  # JOB: DEPLOY-PRODUCTION - Deploy para ambiente de Produção
  # ============================================================
  deploy-production:
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.27.0'

      - name: Configure kubectl for production
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes (Production)
        run: |
          kubectl apply -k k8s/overlays/production --namespace=production || kubectl create namespace production && kubectl apply -k k8s/overlays/production --namespace=production
          kubectl rollout status deployment -l app=microservices --namespace=production --timeout=5m

  # ============================================================
  # JOB: SECURITY-SCAN - Verificação de segurança
  # ============================================================
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
