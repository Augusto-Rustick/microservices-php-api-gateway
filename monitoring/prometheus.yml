global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'microservices-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kong'
    static_configs:
      - targets: ['kong:8001']
    metrics_path: '/metrics'

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']
    metrics_path: '/api/metrics'
    basic_auth:
      username: 'user'
      password: 'password'

  - job_name: 'catalog'
    static_configs:
      - targets: ['catalog:80']
    metrics_path: '/metrics'

  - job_name: 'orders'
    static_configs:
      - targets: ['orders:80']
    metrics_path: '/metrics'

  - job_name: 'promotions'
    static_configs:
      - targets: ['promotions:80']
    metrics_path: '/metrics'

  - job_name: 'payment'
    static_configs:
      - targets: ['payment:80']
    metrics_path: '/metrics'

  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']
