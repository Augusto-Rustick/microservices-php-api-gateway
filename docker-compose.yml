version: '3.8'

services:
  # -----------------------------------------------------------------
  # API GATEWAY (KONG)
  # -----------------------------------------------------------------
  kong-database:
    image: postgres:13
    container_name: kong-database
    restart: always
    environment:
      POSTGRES_USER: ${KONG_DB_USER:-kong}
      POSTGRES_DB: ${KONG_DB_NAME:-kong}
      POSTGRES_PASSWORD: ${KONG_DB_PASSWORD:-kong}
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${KONG_DB_USER:-kong}", "-d", "${KONG_DB_NAME:-kong}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kong-migrations:
    image: kong:3.7.1
    container_name: kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_DB_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong}
    command: kong migrations bootstrap
    depends_on:
      kong-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  kong:
    image: kong:3.7.1
    container_name: kong
    restart: always
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: ${KONG_DB_USER:-kong}
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD:-kong}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_PLUGINS: bundled
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
    ports:
      - "8000:8000/tcp" # Proxy HTTP
      - "8443:8443/tcp" # Proxy HTTPS
      - "8001:8001/tcp" # Admin HTTP
      - "8444:8444/tcp" # Admin HTTPS
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
      - ./kong/setup_kong.sh:/usr/local/bin/setup_kong.sh:ro
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
      kong-database:
        condition: service_healthy

  # -----------------------------------------------------------------
  # MESSAGE BROKER (RABBITMQ)
  # -----------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

  # -----------------------------------------------------------------
  # MONITORING (PROMETHEUS & GRAFANA)
  # -----------------------------------------------------------------
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   restart: always
  #   volumes:
  #     - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/usr/share/prometheus/console_libraries'
  #     - '--web.console.templates=/usr/share/prometheus/consoles'
  #   ports:
  #     - "9090:9090"

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana

  # -----------------------------------------------------------------
  # MICROSERVICES (PHP)
  # -----------------------------------------------------------------
  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    container_name: catalog
    restart: always
    volumes:
      - ./catalog:/var/www/html
    expose:
      - "80"
    environment:
      SERVICE_NAME: catalog
      RABBITMQ_HOST: rabbitmq

  orders:
    build:
      context: ./orders
      dockerfile: Dockerfile
    container_name: orders
    restart: always
    volumes:
      - ./orders:/var/www/html
    expose:
      - "80"
    environment:
      SERVICE_NAME: orders
      RABBITMQ_HOST: rabbitmq

  promotions:
    build:
      context: ./promotions
      dockerfile: Dockerfile
    container_name: promotions
    restart: always
    volumes:
      - ./promotions:/var/www/html
    expose:
      - "80"
    environment:
      SERVICE_NAME: promotions
      RABBITMQ_HOST: rabbitmq

  payment:
    build:
      context: ./payment
      dockerfile: Dockerfile
    container_name: payment
    restart: always
    volumes:
      - ./payment:/var/www/html
    expose:
      - "80"
    environment:
      SERVICE_NAME: payment
      RABBITMQ_HOST: rabbitmq

volumes:
  kong_data: {}
  # grafana_data: {}
